<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول — بوت أمازون</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
        }
    </style>
</head>

<body
    class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-600 via-purple-600 to-indigo-800 p-4">

    <!-- Decorative shapes -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-20 -right-20 w-96 h-96 bg-white/5 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-32 -left-32 w-[500px] h-[500px] bg-purple-400/10 rounded-full blur-3xl"></div>
        <div class="absolute top-1/3 left-1/4 w-64 h-64 bg-indigo-300/10 rounded-full blur-2xl"></div>
    </div>

    <!-- Login card -->
    <div class="relative w-full max-w-md">

        <!-- Card -->
        <div class="bg-white/95 backdrop-blur-xl rounded-3xl shadow-2xl p-8 sm:p-10">

            <!-- Logo & title -->
            <div class="text-center mb-8">
                <div
                    class="inline-flex items-center justify-center w-20 h-20 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl mb-5 shadow-lg shadow-indigo-500/30">
                    <div class="w-14 h-14 rounded-2xl bg-indigo-500 flex items-center justify-center mx-auto">
                        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                d="M9.75 3.104v5.714a2.25 2.25 0 01-.659 1.591L5 14.5M9.75 3.104c-.251.023-.501.05-.75.082m.75-.082a24.301 24.301 0 014.5 0m0 0v5.714c0 .597.237 1.17.659 1.591L19.8 15.3M14.25 3.104c.251.023.501.05.75.082M19.8 15.3l-1.57.393A9.065 9.065 0 0112 15a9.065 9.065 0 00-6.23.693L5 14.5m14.8.8l1.402 1.402c1.232 1.232.65 3.318-1.067 3.611A48.309 48.309 0 0112 21c-2.773 0-5.491-.235-8.135-.687-1.718-.293-2.3-2.379-1.067-3.61L5 14.5" />
                        </svg>
                    </div>
                </div>
                <h1 class="text-2xl font-extrabold text-gray-800">بوت أمازون</h1>
                <p class="text-gray-500 text-sm mt-1">لوحة التحكم</p>
            </div>

            <!-- Error message -->
            {% if error %}
            <div
                class="mb-6 bg-red-50 border border-red-200 text-red-600 rounded-xl px-4 py-3 text-sm flex items-center gap-2">
                <svg class="w-4 h-4 text-red-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 9v3.75m9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
                </svg>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <!-- Form -->
            <form method="POST" action="/login" class="space-y-5">

                <!-- Username -->
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-2">
                        اسم المستخدم
                    </label>
                    <div class="relative">
                        <span class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                            </svg>
                        </span>
                        <input type="text" id="username" name="username" required autocomplete="username"
                            placeholder="admin" class="w-full pr-12 pl-4 py-3 bg-gray-50 border border-gray-200 rounded-xl
                                      text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500
                                      focus:bg-white transition-all outline-none">
                    </div>
                </div>

                <!-- Password -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                        كلمة المرور
                    </label>
                    <div class="relative">
                        <span class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                    d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                            </svg>
                        </span>
                        <input type="password" id="password" name="password" required autocomplete="current-password"
                            placeholder="••••••••" class="w-full pr-12 pl-4 py-3 bg-gray-50 border border-gray-200 rounded-xl
                                      text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500
                                      focus:bg-white transition-all outline-none">
                    </div>
                </div>

                <!-- Submit -->
                <button type="submit" class="w-full py-3.5 bg-gradient-to-l from-indigo-600 to-purple-600
                               hover:from-indigo-700 hover:to-purple-700 text-white font-bold
                               rounded-xl shadow-lg shadow-indigo-500/30 hover:shadow-indigo-500/40
                               transition-all duration-200 text-sm">
                    تسجيل الدخول
                </button>
            </form>

            <!-- Recovery link -->
            <div class="text-center mt-5">
                <a href="/recover" class="text-xs text-gray-400 hover:text-indigo-500 transition-colors">
                    نسيت كلمة المرور؟
                </a>
            </div>
        </div>

        <!-- Footer -->
        <p class="text-center text-white/40 text-xs mt-6">
            بوت أمازون — نظام النشر التلقائي v1.0
        </p>
    </div>

</body>

</html>
