<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}لوحة التحكم{% endblock %} — بوت أمازون</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Tajawal', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

    <!-- Alpine.js + Plugins -->
    <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/custom.css">

    <style>
        body {
            font-family: 'Tajawal', sans-serif;
        }

        /* Sidebar icon sizing */
        .nav-icon {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }
    </style>

    {% block head %}{% endblock %}
</head>

<body class="bg-gray-50 text-gray-800 min-h-screen" x-data="{ sidebarOpen: false }">

    <!-- ── Mobile overlay ────────────────────────────────── -->
    <div x-show="sidebarOpen" x-transition:enter="transition-opacity ease-out duration-200"
        x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
        x-transition:leave="transition-opacity ease-in duration-150" x-transition:leave-start="opacity-100"
        x-transition:leave-end="opacity-0" @click="sidebarOpen = false" class="fixed inset-0 bg-black/40 z-30 md:hidden"
        style="display:none"></div>

    <!-- ── Sidebar ───────────────────────────────────────── -->
    <aside class="sidebar fixed top-0 right-0 h-full w-64 bg-gray-900 text-gray-300 z-40
                  transform transition-transform duration-200 ease-in-out
                  md:translate-x-0 overflow-y-auto"
        :class="sidebarOpen ? 'translate-x-0' : 'translate-x-full md:translate-x-0'">

        <!-- Logo -->
        <div class="px-6 py-6 border-b border-gray-700/50">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-indigo-500 flex items-center justify-center">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                            d="M9.75 3.104v5.714a2.25 2.25 0 01-.659 1.591L5 14.5M9.75 3.104c-.251.023-.501.05-.75.082m.75-.082a24.301 24.301 0 014.5 0m0 0v5.714c0 .597.237 1.17.659 1.591L19.8 15.3M14.25 3.104c.251.023.501.05.75.082M19.8 15.3l-1.57.393A9.065 9.065 0 0112 15a9.065 9.065 0 00-6.23.693L5 14.5m14.8.8l1.402 1.402c1.232 1.232.65 3.318-1.067 3.611A48.309 48.309 0 0112 21c-2.773 0-5.491-.235-8.135-.687-1.718-.293-2.3-2.379-1.067-3.61L5 14.5" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-white font-bold text-lg leading-tight">بوت أمازون</h1>
                    <p class="text-gray-500 text-xs">لوحة التحكم</p>
                </div>
            </div>
        </div>

        <!-- Navigation -->
        <nav class="mt-4 px-3 space-y-1">
            <a href="/"
                class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all duration-150
                      {% if request.url.path == '/' %}nav-active bg-indigo-500/10 text-white{% else %}hover:bg-gray-800 hover:text-white text-gray-400{% endif %}">
                <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                        d="M3.75 3v11.25A2.25 2.25 0 006 16.5h2.25M3.75 3h-1.5m1.5 0h16.5m0 0h1.5m-1.5 0v11.25A2.25 2.25 0 0118 16.5h-2.25m-7.5 0h7.5m-7.5 0l-1 3m8.5-3l1 3m0 0l.5 1.5m-.5-1.5h-9.5m0 0l-.5 1.5" />
                </svg>
                <span>الرئيسية</span>
            </a>
            <a href="/categories"
                class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all duration-150
                      {% if request.url.path == '/categories' %}nav-active bg-indigo-500/10 text-white{% else %}hover:bg-gray-800 hover:text-white text-gray-400{% endif %}">
                <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                        d="M2.25 12.75V12A2.25 2.25 0 014.5 9.75h15A2.25 2.25 0 0121.75 12v.75m-8.69-6.44l-2.12-2.12a1.5 1.5 0 00-1.061-.44H4.5A2.25 2.25 0 002.25 6v12a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9a2.25 2.25 0 00-2.25-2.25h-5.379a1.5 1.5 0 01-1.06-.44z" />
                </svg>
                <span>الفئات</span>
            </a>
            <a href="/schedule"
                class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all duration-150
                      {% if request.url.path == '/schedule' %}nav-active bg-indigo-500/10 text-white{% else %}hover:bg-gray-800 hover:text-white text-gray-400{% endif %}">
                <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                        d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span>الجدول</span>
            </a>
            <a href="/templates"
                class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all duration-150
                      {% if request.url.path == '/templates' %}nav-active bg-indigo-500/10 text-white{% else %}hover:bg-gray-800 hover:text-white text-gray-400{% endif %}">
                <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                        d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" />
                </svg>
                <span>القوالب</span>
            </a>
            <a href="/logs"
                class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all duration-150
                      {% if request.url.path == '/logs' %}nav-active bg-indigo-500/10 text-white{% else %}hover:bg-gray-800 hover:text-white text-gray-400{% endif %}">
                <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                        d="M8.25 6.75h12M8.25 12h12m-12 5.25h12M3.75 6.75h.007v.008H3.75V6.75zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zM3.75 12h.007v.008H3.75V12zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm-.375 5.25h.007v.008H3.75v-.008zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />
                </svg>
                <span>السجل</span>
            </a>
            <a href="/settings"
                class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all duration-150
                      {% if request.url.path == '/settings' %}nav-active bg-indigo-500/10 text-white{% else %}hover:bg-gray-800 hover:text-white text-gray-400{% endif %}">
                <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                        d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.24-.438.613-.431.992a6.759 6.759 0 010 .255c-.007.378.138.75.43.99l1.005.828c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 010-.255c.007-.378-.138-.75-.43-.99l-1.004-.828a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.281z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                <span>الإعدادات</span>
            </a>
        </nav>

        <!-- Bottom section -->
        <div class="absolute bottom-0 left-0 right-0 p-3 border-t border-gray-700/50">
            <a href="/logout" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium
                      text-gray-500 hover:text-red-400 hover:bg-gray-800 transition-all duration-150">
                <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                        d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9" />
                </svg>
                <span>تسجيل الخروج</span>
            </a>
        </div>
    </aside>

    <!-- ── Main content wrapper ──────────────────────────── -->
    <div class="md:mr-64 min-h-screen flex flex-col">

        <!-- Header -->
        <header class="bg-white border-b border-gray-200 sticky top-0 z-20">
            <div class="flex items-center justify-between px-4 sm:px-6 py-4">
                <div class="flex items-center gap-4">
                    <!-- Mobile hamburger -->
                    <button @click="sidebarOpen = !sidebarOpen"
                        class="md:hidden p-2 rounded-lg hover:bg-gray-100 transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>
                    <h2 class="text-lg font-bold text-gray-800">
                        {% block page_title %}{% endblock %}
                    </h2>
                </div>

                <div class="flex items-center gap-3 text-sm text-gray-500">
                    <div class="w-8 h-8 rounded-full bg-indigo-100 flex items-center justify-center">
                        <span class="text-indigo-600 font-bold text-xs">م</span>
                    </div>
                    <span class="hidden sm:inline">مرحباً، المسؤول</span>
                </div>
            </div>
        </header>

        <!-- Page content -->
        <main class="flex-1 p-4 sm:p-6 lg:p-8">
            {% block content %}{% endblock %}
        </main>

        <!-- Footer -->
        <footer class="px-6 py-4 text-center text-xs text-gray-400 border-t border-gray-100">
            بوت أمازون — لوحة التحكم v1.0
        </footer>
    </div>

    <!-- ── Toast container ───────────────────────────────── -->
    <div id="toast-container" class="fixed bottom-6 left-6 z-50 space-y-3"></div>

    <!-- App JS -->
    <script src="/static/js/app.js"></script>

    {% block scripts %}{% endblock %}
</body>

</html>
