<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استعادة الحساب — بوت أمازون</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
        }
    </style>
</head>

<body
    class="min-h-screen flex items-center justify-center bg-gradient-to-br from-amber-500 via-orange-500 to-amber-700 p-4">

    <!-- Decorative shapes -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-20 -right-20 w-96 h-96 bg-white/5 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-32 -left-32 w-[500px] h-[500px] bg-orange-300/10 rounded-full blur-3xl"></div>
        <div class="absolute top-1/3 left-1/4 w-64 h-64 bg-amber-200/10 rounded-full blur-2xl"></div>
    </div>

    <!-- Recovery card -->
    <div class="relative w-full max-w-md" x-data="recoverPage()">

        <div class="bg-white/95 backdrop-blur-xl rounded-3xl shadow-2xl p-8 sm:p-10">

            <!-- Header -->
            <div class="text-center mb-8">
                <div
                    class="inline-flex items-center justify-center w-20 h-20 bg-gradient-to-br from-amber-500 to-orange-600 rounded-2xl mb-5 shadow-lg shadow-amber-500/30">
                    <span class="text-3xl">🔑</span>
                </div>
                <h1 class="text-2xl font-extrabold text-gray-800">استعادة الحساب</h1>
                <p class="text-gray-500 text-sm mt-1">استخدم مفتاح الاسترداد لإعادة تعيين كلمة المرور</p>
            </div>

            <!-- Success message -->
            <div x-show="success"
                class="mb-6 bg-emerald-50 border border-emerald-200 text-emerald-700 rounded-xl px-4 py-4 text-center"
                style="display:none">
                <p class="text-sm font-bold mb-2">✅ تم إعادة تعيين كلمة المرور بنجاح</p>
                <a href="/login" class="text-xs text-emerald-600 hover:text-emerald-800 underline font-medium">
                    تسجيل الدخول →
                </a>
            </div>

            <!-- Error message -->
            <div x-show="error"
                class="mb-6 bg-red-50 border border-red-200 text-red-600 rounded-xl px-4 py-3 text-sm flex items-center gap-2"
                style="display:none">
                <svg class="w-4 h-4 text-red-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 9v3.75m9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
                </svg>
                <span x-text="error"></span>
            </div>

            <!-- Form -->
            <div x-show="!success" class="space-y-5">

                <!-- Username -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">اسم المستخدم</label>
                    <div class="relative">
                        <span class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                            </svg>
                        </span>
                        <input type="text" x-model="form.username" placeholder="admin"
                            class="w-full pr-12 pl-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-amber-500 focus:border-amber-500 focus:bg-white transition-all outline-none">
                    </div>
                </div>

                <!-- Recovery Key -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">مفتاح الاسترداد</label>
                    <div class="relative">
                        <span class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                    d="M15.75 5.25a3 3 0 013 3m3 0a6 6 0 01-7.029 5.912c-.563-.097-1.159.026-1.563.43L10.5 17.25H8.25v2.25H6v2.25H2.25v-2.818c0-.597.237-1.17.659-1.591l6.499-6.499c.404-.404.527-1 .43-1.563A6 6 0 1121.75 8.25z" />
                            </svg>
                        </span>
                        <input type="text" x-model="form.recovery_key" placeholder="XXXX-XXXX-XXXX-XXXX" dir="ltr"
                            @input="formatRecoveryKey()"
                            class="w-full pr-12 pl-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm font-mono tracking-wider focus:ring-2 focus:ring-amber-500 focus:border-amber-500 focus:bg-white transition-all outline-none text-center">
                    </div>
                </div>

                <!-- New Password -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">كلمة المرور الجديدة</label>
                    <input :type="showNewPw ? 'text' : 'password'" x-model="form.new_password" @input="updateStrength()"
                        placeholder="8 أحرف على الأقل"
                        class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-amber-500 focus:border-amber-500 focus:bg-white transition-all outline-none">
                    <!-- Strength -->
                    <div x-show="form.new_password" class="mt-2">
                        <div class="h-1.5 bg-gray-100 rounded-full overflow-hidden">
                            <div class="h-full transition-all duration-300 rounded-full" :class="pwStrength.color"
                                :style="`width: ${pwStrength.level}%`"></div>
                        </div>
                        <p class="text-[10px] mt-1"
                            :class="pwStrength.level >= 75 ? 'text-emerald-600' : pwStrength.level >= 50 ? 'text-yellow-600' : 'text-red-500'"
                            x-text="pwStrength.label"></p>
                    </div>
                </div>

                <!-- Confirm Password -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">تأكيد كلمة المرور</label>
                    <input type="password" x-model="form.confirm_password" placeholder="أعد كتابة كلمة المرور"
                        class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-amber-500 focus:border-amber-500 focus:bg-white transition-all outline-none">
                    <p x-show="form.confirm_password" class="text-[10px] mt-1"
                        :class="form.new_password === form.confirm_password ? 'text-emerald-600' : 'text-red-500'">
                        <span
                            x-text="form.new_password === form.confirm_password ? '✅ متطابقة' : '❌ غير متطابقة'"></span>
                    </p>
                </div>

                <!-- Submit -->
                <button @click="submit()" :disabled="!canSubmit() || submitting" class="w-full py-3.5 bg-gradient-to-l from-amber-600 to-orange-600
                           hover:from-amber-700 hover:to-orange-700 text-white font-bold
                           rounded-xl shadow-lg shadow-amber-500/30 hover:shadow-amber-500/40
                           transition-all duration-200 text-sm disabled:opacity-50">
                    <span x-text="submitting ? 'جارِ الإرسال...' : '🔑 إعادة تعيين كلمة المرور'"></span>
                </button>
            </div>

            <!-- Warning -->
            <p class="text-center text-[10px] text-gray-400 mt-5">
                ⚠️ هذه الصفحة مخصصة لاستعادة الحساب فقط عند فقدان كلمة المرور.
            </p>
        </div>

        <!-- Bottom links -->
        <div class="text-center mt-5">
            <a href="/login" class="text-sm text-white/70 hover:text-white transition-colors">
                ↩️ العودة لتسجيل الدخول
            </a>
        </div>
    </div>

    <script>
        function recoverPage() {
            return {
                form: {
                    username: '',
                    recovery_key: '',
                    new_password: '',
                    confirm_password: '',
                },
                pwStrength: { level: 0, label: '', color: 'bg-gray-200' },
                showNewPw: false,
                submitting: false,
                error: '',
                success: false,

                formatRecoveryKey() {
                    let val = this.form.recovery_key.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
                    let parts = [];
                    for (let i = 0; i < val.length && i < 16; i += 4) {
                        parts.push(val.slice(i, i + 4));
                    }
                    this.form.recovery_key = parts.join('-');
                },

                updateStrength() {
                    const pw = this.form.new_password;
                    if (!pw) { this.pwStrength = { level: 0, label: '', color: 'bg-gray-200' }; return; }
                    const len = pw.length;
                    if (len < 8) { this.pwStrength = { level: 25, label: 'ضعيفة', color: 'bg-red-500' }; return; }
                    const hasMixed = /[a-z]/.test(pw) && /[A-Z]/.test(pw);
                    const hasNum = /\d/.test(pw);
                    const hasSpecial = /[^a-zA-Z0-9]/.test(pw);
                    if (len >= 12 && hasMixed && hasNum && hasSpecial) { this.pwStrength = { level: 100, label: 'ممتازة', color: 'bg-emerald-500' }; return; }
                    if (len >= 12) { this.pwStrength = { level: 75, label: 'قوية', color: 'bg-emerald-500' }; return; }
                    this.pwStrength = { level: 50, label: 'متوسطة', color: 'bg-yellow-500' };
                },

                canSubmit() {
                    return this.form.username &&
                        this.form.recovery_key.length >= 19 &&
                        this.form.new_password.length >= 8 &&
                        this.form.new_password === this.form.confirm_password;
                },

                async submit() {
                    this.submitting = true;
                    this.error = '';
                    try {
                        const res = await fetch('/api/recover', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(this.form),
                        });
                        const data = await res.json();
                        if (!res.ok) {
                            this.error = data.detail || 'حدث خطأ غير متوقع';
                        } else {
                            this.success = true;
                        }
                    } catch (e) {
                        this.error = 'خطأ في الاتصال بالخادم';
                    }
                    this.submitting = false;
                },
            };
        }
    </script>

</body>

</html>
