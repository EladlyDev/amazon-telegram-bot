{% extends "base.html" %}

{% block title %}الجدول الزمني{% endblock %}
{% block page_title %}
<svg class="w-5 h-5 inline-block ml-1 -mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
        d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" />
</svg>
الجدول الزمني
{% endblock %}

{% block content %}
<div x-data="schedulePage()" x-init="loadSchedule()" class="space-y-6 max-w-4xl">

    <!-- Loading -->
    <div x-show="loading" class="text-center py-16">
        <div class="spinner mx-auto mb-4" style="width:32px;height:32px;border-width:3px"></div>
        <p class="text-gray-400 text-sm">جارِ تحميل الجدول...</p>
    </div>

    <template x-if="!loading && schedule.id">
        <div class="space-y-6">

            <!-- A) Status Banner -->
            <div class="rounded-2xl p-5 shadow-sm transition-all duration-300" :class="schedule.is_active
            ? 'bg-gradient-to-l from-emerald-50 to-green-50 border border-emerald-200'
            : 'bg-gradient-to-l from-amber-50 to-yellow-50 border border-amber-200'">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-lg flex items-center justify-center"
                            :class="schedule.is_active ? 'bg-emerald-100' : 'bg-amber-100'">
                            <svg class="w-4 h-4" :class="schedule.is_active ? 'text-emerald-600' : 'text-amber-600'"
                                fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                    d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                        </div>
                        <span class="font-bold text-sm"
                            :class="schedule.is_active ? 'text-emerald-800' : 'text-amber-800'"
                            x-text="schedule.is_active ? 'الجدولة مفعّلة' : 'الجدولة معطّلة'"></span>
                    </div>
                    <button @click="toggleActive()"
                        class="w-12 h-7 rounded-full relative transition-colors duration-200"
                        :class="schedule.is_active ? 'bg-emerald-500' : 'bg-gray-300'">
                        <span class="absolute top-1 w-5 h-5 bg-white rounded-full shadow-sm transition-all duration-200"
                            :class="schedule.is_active ? 'left-1' : 'left-[24px]'"></span>
                    </button>
                </div>
            </div>

            <!-- B) Schedule Type Selector -->
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
                <h3 class="text-sm font-bold text-gray-700 mb-4 flex items-center gap-2">
                    <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                            d="M8.25 6.75h12M8.25 12h12m-12 5.25h12M3.75 6.75h.007v.008H3.75V6.75zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zM3.75 12h.007v.008H3.75V12zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm-.375 5.25h.007v.008H3.75v-.008zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />
                    </svg>
                    نوع الجدول
                </h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <button @click="schedule.schedule_type = 'fixed_times'"
                        class="p-5 rounded-xl border-2 text-right transition-all" :class="schedule.schedule_type === 'fixed_times'
                        ? 'border-indigo-500 bg-indigo-50'
                        : 'border-gray-200 hover:border-gray-300 bg-white'">
                        <div class="w-10 h-10 rounded-xl mb-3 flex items-center justify-center"
                            :class="schedule.schedule_type === 'fixed_times' ? 'bg-indigo-100' : 'bg-gray-100'">
                            <svg class="w-5 h-5"
                                :class="schedule.schedule_type === 'fixed_times' ? 'text-indigo-600' : 'text-gray-500'"
                                fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                    d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                        </div>
                        <div class="font-bold text-sm text-gray-800">أوقات محددة</div>
                        <div class="text-xs text-gray-500 mt-1">حدد أوقات معينة للنشر يومياً</div>
                    </button>
                    <button @click="schedule.schedule_type = 'interval'"
                        class="p-5 rounded-xl border-2 text-right transition-all" :class="schedule.schedule_type === 'interval'
                        ? 'border-indigo-500 bg-indigo-50'
                        : 'border-gray-200 hover:border-gray-300 bg-white'">
                        <div class="w-10 h-10 rounded-xl mb-3 flex items-center justify-center"
                            :class="schedule.schedule_type === 'interval' ? 'bg-indigo-100' : 'bg-gray-100'">
                            <svg class="w-5 h-5"
                                :class="schedule.schedule_type === 'interval' ? 'text-indigo-600' : 'text-gray-500'"
                                fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                    d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182" />
                            </svg>
                        </div>
                        <div class="font-bold text-sm text-gray-800">كل فترة زمنية</div>
                        <div class="text-xs text-gray-500 mt-1">نشر تلقائي كل عدد دقائق محدد</div>
                    </button>
                </div>
            </div>

            <!-- C) Fixed Times Config -->
            <div x-show="schedule.schedule_type === 'fixed_times'" x-collapse
                class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
                <h3 class="text-sm font-bold text-gray-700 mb-4 flex items-center gap-2">
                    <svg class="w-4 h-4 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                            d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    أوقات النشر اليومية
                </h3>
                <div class="flex flex-wrap gap-2 mb-4">
                    <template x-for="(time, idx) in fixedTimes" :key="idx">
                        <span
                            class="inline-flex items-center gap-2 bg-indigo-50 text-indigo-700 px-3 py-1.5 rounded-full text-sm font-medium">
                            <span x-text="time"></span>
                            <button @click="removeTime(idx)" class="hover:text-red-500 transition-colors text-xs">
                                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M6 18L18 6M6 6l12 12" />
                                </svg>
                            </button>
                        </span>
                    </template>
                    <span x-show="fixedTimes.length === 0" class="text-sm text-gray-400">لا توجد أوقات محددة</span>
                </div>
                <div class="flex gap-2 mb-6">
                    <input type="time" x-model="newTime"
                        class="px-3 py-2 text-sm bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
                    <button @click="addTime()"
                        class="px-4 py-2 bg-indigo-500 hover:bg-indigo-600 text-white text-xs font-medium rounded-xl transition-colors flex items-center gap-1.5">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 4.5v15m7.5-7.5h-15" />
                        </svg>
                        إضافة
                    </button>
                </div>
                <div x-show="fixedTimes.length > 0">
                    <h4 class="text-xs font-medium text-gray-500 mb-3">الجدول اليومي</h4>
                    <div class="relative bg-gray-100 rounded-full h-3 mx-2">
                        <template x-for="h in [0,6,12,18,24]" :key="h">
                            <div class="absolute top-5 text-[9px] text-gray-400 -translate-x-1/2"
                                :style="'left:' + (h / 24 * 100) + '%'" x-text="String(h).padStart(2,'0') + ':00'">
                            </div>
                        </template>
                        <template x-for="(time, idx) in fixedTimes" :key="'dot'+idx">
                            <div class="absolute top-1/2 -translate-y-1/2 -translate-x-1/2"
                                :style="'left:' + timeToPercent(time) + '%'">
                                <div class="w-4 h-4 bg-indigo-500 rounded-full border-2 border-white shadow-sm"></div>
                                <div class="absolute -top-6 left-1/2 -translate-x-1/2 text-[9px] font-medium text-indigo-600 whitespace-nowrap"
                                    x-text="time"></div>
                            </div>
                        </template>
                    </div>
                    <div class="h-8"></div>
                </div>
            </div>

            <!-- C) Interval Config -->
            <div x-show="schedule.schedule_type === 'interval'" x-collapse
                class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
                <h3 class="text-sm font-bold text-gray-700 mb-4 flex items-center gap-2">
                    <svg class="w-4 h-4 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                            d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182" />
                    </svg>
                    فترة النشر
                </h3>
                <div class="flex flex-wrap gap-2 mb-5">
                    <template
                        x-for="p in [{label:'كل ساعة',val:60},{label:'كل ساعتين',val:120},{label:'كل 3 ساعات',val:180},{label:'كل 4 ساعات',val:240}]"
                        :key="p.val">
                        <button @click="schedule.interval_minutes = p.val"
                            class="px-4 py-2 rounded-xl text-xs font-medium border-2 transition-all" :class="schedule.interval_minutes === p.val
                            ? 'border-indigo-500 bg-indigo-50 text-indigo-700'
                            : 'border-gray-200 hover:border-gray-300 text-gray-600'" x-text="p.label"></button>
                    </template>
                </div>
                <div class="flex items-center gap-3 mb-4">
                    <label class="text-xs text-gray-600">مخصص:</label>
                    <input type="number" x-model.number="schedule.interval_minutes" min="15" max="1440"
                        class="w-24 px-3 py-2 text-sm bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none text-center">
                    <span class="text-xs text-gray-500">دقيقة</span>
                </div>
                <div class="bg-indigo-50 rounded-xl px-4 py-3 text-sm text-indigo-700 flex items-center gap-2">
                    <svg class="w-4 h-4 text-indigo-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                            d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 013 19.875v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V4.125z" />
                    </svg>
                    سينشر حوالي
                    <span class="font-bold" x-text="Math.floor(24 * 60 / (schedule.interval_minutes || 180))"></span>
                    مرة يومياً
                </div>
            </div>

            <!-- D) Additional Settings -->
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
                <h3 class="text-sm font-bold text-gray-700 mb-4 flex items-center gap-2">
                    <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                            d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.24-.438.613-.431.992a6.759 6.759 0 010 .255c-.007.378.138.75.43.99l1.005.828c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 010-.255c.007-.378-.138-.75-.43-.99l-1.004-.828a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.281z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                    إعدادات إضافية
                </h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1.5">عدد المنتجات في كل مرة</label>
                        <input type="number" x-model.number="schedule.products_per_batch" min="1" max="10"
                            class="w-full px-3 py-2.5 text-sm bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
                        <p class="text-[10px] text-gray-400 mt-1">عدد المنتجات التي تُنشر في كل دورة نشر</p>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1.5">المنطقة الزمنية</label>
                        <select x-model="schedule.timezone"
                            class="w-full px-3 py-2.5 text-sm bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
                            <option value="Asia/Riyadh">Asia/Riyadh — الرياض</option>
                            <option value="Asia/Dubai">Asia/Dubai — دبي</option>
                            <option value="Asia/Kuwait">Asia/Kuwait — الكويت</option>
                            <option value="Africa/Cairo">Africa/Cairo — القاهرة</option>
                            <option value="Europe/Istanbul">Europe/Istanbul — إسطنبول</option>
                            <option value="UTC">UTC</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- E) Save Button -->
            <div class="flex justify-end">
                <button @click="saveSchedule()" :disabled="saving" class="px-8 py-3 bg-indigo-500 hover:bg-indigo-600 text-white text-sm font-bold
                       rounded-xl shadow-sm transition-all disabled:opacity-50 flex items-center gap-2">
                    <span x-show="saving" class="spinner" style="width:14px;height:14px;border-width:2px"></span>
                    <span x-show="!saving">
                        <svg class="w-4 h-4 inline -mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                d="M17.593 3.322c1.1.128 1.907 1.077 1.907 2.185V21L12 17.25 4.5 21V5.507c0-1.108.806-2.057 1.907-2.185a48.507 48.507 0 0111.186 0z" />
                        </svg>
                    </span>
                    <span x-text="saving ? 'جارِ الحفظ...' : 'حفظ التغييرات'"></span>
                </button>
            </div>

        </div>
    </template>
</div>
{% endblock %}

{% block scripts %}
<script>
    function schedulePage() {
        return {
            schedule: {},
            fixedTimes: [],
            loading: false,
            saving: false,
            newTime: '',

            async loadSchedule() {
                this.loading = true;
                try {
                    const data = await apiCall('/api/schedule');
                    this.schedule = data;
                    try {
                        this.fixedTimes = JSON.parse(data.fixed_times || '[]');
                    } catch { this.fixedTimes = []; }
                    this.fixedTimes.sort();
                } catch (e) { }
                this.loading = false;
            },

            async saveSchedule() {
                this.saving = true;
                try {
                    const payload = { ...this.schedule };
                    payload.fixed_times = JSON.stringify(this.fixedTimes);
                    await apiCall('/api/schedule', 'PUT', payload);
                    showToast('تم حفظ الجدول بنجاح', 'success');
                    await this.loadSchedule();
                } catch (e) { }
                this.saving = false;
            },

            async toggleActive() {
                this.schedule.is_active = !this.schedule.is_active;
                await this.saveSchedule();
            },

            addTime() {
                if (!this.newTime) return;
                const t = this.newTime.slice(0, 5);
                if (this.fixedTimes.includes(t)) {
                    showToast('هذا الوقت موجود بالفعل', 'error');
                    return;
                }
                this.fixedTimes.push(t);
                this.fixedTimes.sort();
                this.newTime = '';
            },

            removeTime(idx) {
                this.fixedTimes.splice(idx, 1);
            },

            timeToPercent(time) {
                const [h, m] = time.split(':').map(Number);
                return ((h * 60 + m) / (24 * 60) * 100).toFixed(2);
            }
        };
    }
</script>
{% endblock %}
